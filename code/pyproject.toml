# RBC-GEM project and tooling configuration


################################################################################
# Build tools configuration                                                    #
################################################################################

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "rbc_gem_utils.__version__"}

################################################################################
# Project configuration                                                        #
################################################################################
[project]
name = "rbc_gem_utils"
dependencies = [
  "biopython",
  "beautifulsoup4",
  "cobra",
  "scipy",
  "memote",
  "pandas",
  "openpyxl",
  "depinfo",
  "networkx",
  "gurobipy",
  "seaborn",
  "scikit-learn",
  "matplotlib",
  "matplotlib-venn",
]
requires-python = ">=3.11"
authors = [
  {name = "Zachary B. Haiman"},
]
maintainers = [
  {name = "Zachary B. Haiman"},
]
description = "Source code for working with the RBC-GEM reconstruction."
keywords = ["python", "red blood cell", "erythrocyte"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
readme = "README.md"
dynamic = ["version"]

# Existing scientific runtime requirements remain above until imports are audited.
# These extras preserve feature installation entry points.
[project.optional-dependencies]
overlay = ["gurobipy"]
database = ["beautifulsoup4", "requests", "biopython"]
vis = ["matplotlib", "matplotlib-venn", "seaborn"]
network = ["networkx"]
notebooks = ["notebook"]
all = ["rbc_gem_utils[database,overlay,vis,network,notebooks]"]

[dependency-groups]
dev = ["pre-commit>=3.2", "ruff==0.16.8", "build", "twine"]
test = ["pytest"]

[project.urls]
"MEMOTE Report" = "https://z-haiman.github.io/RBC-GEM/"
Repository = "https://github.com/z-haiman/RBC-GEM.git"
"Bug Tracker" = "https://github.com/z-haiman/RBC-GEM/issues"
Changelog = "https://github.com/z-haiman/RBC-GEM/blob/main/HISTORY.md"


################################################################################
# Lint tools configuration                                                     #
################################################################################

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "PGH004", "G010"]

[tool.ruff.lint.isort]
lines-after-imports = 2
